# Server
server.port=${PORT:8088}

# Default local database.
# Data is stored in springboot-backend/data/agriconnect.mv.db so the app works
# without installing MySQL. Use application-mysql.properties for MySQL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/agriconnect;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}

# JWT
app.jwt.secret=${JWT_SECRET:AgriConnectSecretKey2024SuperLongSecretKeyForHMACSHA256Signing}
app.jwt.expiration=86400000

# Razorpay
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_YOUR_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:YOUR_KEY_SECRET}

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.agriconnect=INFO
